# MISALA — nginx site config
#
# Serves the built React homepage as static files and reverse-proxies
# /api/, /admin/, and /static/ (Django admin CSS/JS) to Gunicorn running
# the Django backend on 127.0.0.1:8000.
#
# Install:
#   sudo cp misala.conf /etc/nginx/sites-available/misala.conf
#   sudo ln -s /etc/nginx/sites-available/misala.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Paths below assume the project is deployed to /var/www/misala — adjust
# to match the actual deployment path on the VPS.

upstream misala_backend {
    server 127.0.0.1:8000;
}

server {
    listen 8014;
    listen [::]:8014;
    server_name portfolio.kamategroup.online;

    # Built React app: `cd frontend && npm run build` outputs to frontend/dist
    root /var/www/misala/frontend/dist;
    index index.html;

    client_max_body_size 10m;

    access_log /var/log/nginx/misala.access.log;
    error_log  /var/log/nginx/misala.error.log;

    # Django REST API
    location /api/ {
        proxy_pass http://misala_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://misala_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's own static files (admin CSS/JS), collected via `collectstatic`
    location /django-static/ {
        alias /var/www/misala/backend/staticfiles/;
    }

    # React app (client-side routing ready for when more pages are added)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
