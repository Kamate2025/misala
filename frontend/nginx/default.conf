# MISALA — nginx site config used INSIDE the `frontend` Docker image.
#
# Copied to /etc/nginx/conf.d/default.conf by frontend/Dockerfile. Serves
# the built React app and reverse-proxies /api/, /admin/, and
# /django-static/ to the `backend` service (Gunicorn) over the Docker
# compose network — the hostname "backend" resolves via Docker's internal
# DNS, matching the service name in docker-compose.yml.
#
# The container listens on port 80; docker-compose.yml maps host port
# 8014 to it, so the whole stack is reachable at http://localhost:8014.

upstream misala_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Django REST API
    location /api/ {
        proxy_pass http://misala_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://misala_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's own static files (admin CSS/JS), served by WhiteNoise from
    # inside the backend container — nginx just proxies through to it.
    location /django-static/ {
        proxy_pass http://misala_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # React app (client-side routing ready for when more pages are added)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
